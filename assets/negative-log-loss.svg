    .note { fill: #1e3a8a; font: 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 600; }
    .point { fill: #ffffff; stroke: #2563eb; stroke-width: 4; }
  </style>
