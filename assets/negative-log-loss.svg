<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Negative logarithm loss as a function of predicted probability</title>
  <desc id="desc">The curve for negative log p decreases steeply from a very large loss near probability zero to zero loss at probability one. Points at p equals 0.1 and 0.9 are labeled.</desc>
